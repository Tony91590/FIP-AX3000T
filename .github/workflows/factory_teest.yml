
name: AX3000T - Patch Factory ALL

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Factory
        run: |
          set -eu

          test -f factory.bin || {
            echo "ERROR: factory.bin not found"
            exit 1
          }

          echo "Factory found:"
          ls -lh factory.bin

      - name: Create patch script
        run: |
          cat > txpwr-patcher.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          FACTORY="$1"

          OFFSET_2G=$((0x441))
          OFFSET_5G=$((0x445))
          OFFSET_6G=$((0x465))

          # TEST VALUES ONLY
          # These are deliberately different from the current values
          # to verify that the patch mechanism actually modifies the file.
          TEST_2G="20 21 22 23"

          TEST_5G="
          20 21 22 23 24
          20 21 22 23 24
          20 21 22 23 24
          20 21 22 23 24
          "

          TEST_6G="
          20 21 22 23 24 25 26 27
          20 21 22 23 24 25 26 27
          20 21 22 23 24 25 26 27
          20 21 22 23 24 25 26 27
          "

          write_hex() {
              offset="$1"
              data="$2"
              tmp=$(mktemp)

              for byte in $data; do
                  printf '%b' "\\$(printf '%03o' "0x$byte")" >> "$tmp"
              done

              dd if="$tmp" \
                 of="$FACTORY" \
                 bs=1 \
                 seek="$offset" \
                 conv=notrunc \
                 status=none

              rm -f "$tmp"
          }

          show_region() {
              offset="$1"
              length="$2"

              hexdump -v \
                -s "$offset" \
                -n "$length" \
                -e '1/1 "%02X " "\n"' \
                "$FACTORY"
          }

          echo "=========================================="
          echo " MT7981 AX3000T FACTORY PATCH TEST"
          echo "=========================================="
          echo
          echo "Factory: $FACTORY"
          echo

          echo "=== BEFORE ==="
          echo
          echo "2.4 GHz:"
          show_region "$OFFSET_2G" 4

          echo "5 GHz:"
          show_region "$OFFSET_5G" 20

          echo "6 GHz:"
          show_region "$OFFSET_6G" 32

          echo
          echo "=== PATCHING TEST DATA ==="

          write_hex "$OFFSET_2G" "$TEST_2G"
          write_hex "$OFFSET_5G" "$TEST_5G"
          write_hex "$OFFSET_6G" "$TEST_6G"

          echo
          echo "=== AFTER ==="
          echo
          echo "2.4 GHz:"
          show_region "$OFFSET_2G" 4

          echo "5 GHz:"
          show_region "$OFFSET_5G" 20

          echo "6 GHz:"
          show_region "$OFFSET_6G" 32

          echo
          echo "Patch script completed."
          SCRIPT

          chmod +x txpwr-patcher.sh

      - name: Patch AX3000T
        run: |
          set -eu

          cp factory.bin factory_patched.bin

          ./txpwr-patcher.sh factory_patched.bin

          echo
          echo "=== VERIFY FILE DIFFERENCE ==="

          if cmp -s factory.bin factory_patched.bin; then
            echo "ERROR: factory_patched.bin is identical to factory.bin"
            echo "No bytes were modified."
            exit 1
          fi

          echo "SUCCESS: factory_patched.bin is different from factory.bin"

          echo
          echo "Changed bytes:"
          cmp -l factory.bin factory_patched.bin | head -100 || true

      - name: Generate SHA256
        run: |
          sha256sum factory.bin > factory.bin.sha256
          sha256sum factory_patched.bin > factory_patched.bin.sha256

          echo "Original:"
          cat factory.bin.sha256

          echo
          echo "Patched:"
          cat factory_patched.bin.sha256

      - name: Upload patched Factory
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-factory-patched-TEST
          path: |
            factory_patched.bin
            factory_patched.bin.sha256

      - name: Upload original Factory
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-factory-original
          path: |
            factory.bin
            factory.bin.sha256
```
