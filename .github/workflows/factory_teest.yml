name: AX3000T - Patch Factory 2G + 5G

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Factory
        run: |
          set -eu

          test -f factory.bin || {
            echo "ERROR: factory.bin not found"
            exit 1
          }

          echo "Factory found:"
          ls -lh factory.bin

      - name: Patch AX3000T 2G + 5G
        run: |
          set -eu

          cp factory.bin factory_patched.bin

          echo "=========================================="
          echo " MT7981 AX3000T FACTORY PATCH"
          echo "=========================================="
          echo
          echo "2.4 GHz: 0x441 -> 30 30 31 31"
          echo "5 GHz  : 0x445 -> 20 x 2E"
          echo "6 GHz  : UNCHANGED"
          echo

          echo "=== BEFORE ==="

          echo "2.4 GHz @ 0x441:"
          hexdump -v -s $((0x441)) -n 4 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo "5 GHz @ 0x445:"
          hexdump -v -s $((0x445)) -n 20 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo "6 GHz @ 0x465:"
          hexdump -v -s $((0x465)) -n 32 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo
          echo "=== PATCHING 2.4 GHz ==="

          printf '\x30\x30\x31\x31' |
            dd of=factory_patched.bin \
              bs=1 \
              seek=$((0x441)) \
              conv=notrunc \
              status=none

          echo
          echo "=== PATCHING 5 GHz ==="

          printf '\x2e%.0s' $(seq 1 20) |
            dd of=factory_patched.bin \
              bs=1 \
              seek=$((0x445)) \
              conv=notrunc \
              status=none

          echo
          echo "=== AFTER ==="

          echo "2.4 GHz @ 0x441:"
          hexdump -v -s $((0x441)) -n 4 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo "5 GHz @ 0x445:"
          hexdump -v -s $((0x445)) -n 20 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo "6 GHz @ 0x465:"
          hexdump -v -s $((0x465)) -n 32 \
            -e '1/1 "%02X " "\n"' \
            factory_patched.bin

          echo
          echo "=== VERIFY FILE DIFFERENCE ==="

          if cmp -s factory.bin factory_patched.bin; then
            echo "ERROR: no bytes changed"
            exit 1
          fi

          echo "SUCCESS: factory_patched.bin differs from factory.bin"

          echo
          echo "=== CHANGED BYTES ==="
          cmp -l factory.bin factory_patched.bin | head -100 || true

      - name: Generate SHA256
        run: |
          set -eu

          sha256sum factory.bin > factory.bin.sha256
          sha256sum factory_patched.bin > factory_patched.bin.sha256

          echo "Original:"
          cat factory.bin.sha256

          echo
          echo "Patched:"
          cat factory_patched.bin.sha256

      - name: Upload patched Factory
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-factory-patched-2G-5G
          path: |
            factory_patched.bin
            factory_patched.bin.sha256

      - name: Upload original Factory
        uses: actions/upload-artifact@v4
        with:
          name: AX3000T-factory-original
          path: |
            factory.bin
            factory.bin.sha256
